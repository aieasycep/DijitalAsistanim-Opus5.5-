name: Setup workspace
description: Node (from .nvmrc), corepack pnpm, pnpm store cache, turbo cache and a frozen install.
inputs:
  turbo-cache-key:
    description: Job-specific prefix for the turbo cache key.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
    - run: corepack enable
      shell: bash
    # Fetch the pinned pnpm up front, retrying: a registry connection reset here used to fail
    # the whole job before any check ran.
    - name: pnpm (corepack install, with retries)
      shell: bash
      run: |
        for attempt in 1 2 3 4; do
          corepack install && exit 0
          echo "corepack install failed (attempt $attempt); retrying" >&2
          sleep $((attempt * 5))
        done
        exit 1
    - name: pnpm store cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - name: turbo cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo
        key: turbo-${{ inputs.turbo-cache-key }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: turbo-${{ inputs.turbo-cache-key }}-${{ runner.os }}-
    - run: pnpm install --frozen-lockfile
      shell: bash
