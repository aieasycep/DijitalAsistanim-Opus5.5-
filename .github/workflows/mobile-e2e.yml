# Mobile E2E on Android (TEST_PLAN §13 / §18 row `e2e-mobile-android`; IMPLEMENTATION_PLAN T-12.02).
# Heavy (emulators + a release build), so it runs on pull requests, nightly and on demand — not
# on every branch push. iOS runs on EAS Workflows (apps/mobile/.eas/workflows/e2e-ios.yml).
name: Mobile E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

# An emulator run takes 30+ minutes: a newer push replaces the queued run, never the one in
# progress, so every run that starts also reports.
concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  MAESTRO_VERSION: 2.10.0
  # One device: the m102 flows sign in as the shared demo canon users, whose data each canon seed
  # resets, so two shards would reset each other's users mid-flow.
  MAESTRO_SHARDS: '1'
  DA_FIXED_NOW: '2026-09-22T05:45:00Z'

jobs:
  e2e-mobile-android:
    name: e2e-mobile-android (tier A + emulator API 35 + Maestro)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: mobile-e2e
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # The real Maestro parser checks every flow before the 15-minute APK build, so a flow the
      # device run would refuse fails here in a minute (scripts/mobile/maestro-lint.ts runs in unit).
      - name: Maestro ${{ env.MAESTRO_VERSION }} and flow syntax
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version
          status=0
          while IFS= read -r -d '' flow; do
            if ! "$HOME/.maestro/bin/maestro" check-syntax "$flow" >/dev/null 2>"$RUNNER_TEMP/syntax.txt"; then
              echo "::error file=$flow::$(grep -v JAVA_TOOL "$RUNNER_TEMP/syntax.txt" | tail -1)"
              status=1
            fi
          done < <(find apps/mobile/.maestro -name '*.yaml' ! -name config.yaml -print0 | sort -z)
          exit "$status"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tier-A stack, functions (APP_ENV=e2e, demo, fixture AI, fixed clock), demo seed, harness
        run: bash scripts/e2e/start-stack.sh

      - name: Build the e2e APK (expo prebuild + Gradle assembleRelease)
        # Run 54 hung here for four hours after Gradle ran out of JVM Metaspace; a hang now fails fast.
        timeout-minutes: 60
        env:
          APP_ENV: e2e
          EXPO_PUBLIC_APP_ENV: e2e
          EXPO_PUBLIC_APP_SCHEME: dijitalasistan-e2e
          EXPO_PUBLIC_DEMO_MODE: 'true'
          EXPO_PUBLIC_ANALYTICS_ENABLED: 'false'
          EXPO_PUBLIC_SUPABASE_URL: http://10.0.2.2:54321
          # External credential required: a RevenueCat Test Store `test_…` public key (CI variable).
          EXPO_PUBLIC_REVENUECAT_TEST_STORE_API_KEY: ${{ vars.REVENUECAT_TEST_STORE_API_KEY }}
          EXPO_NO_TELEMETRY: '1'
        run: |
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$E2E_SUPABASE_PUBLISHABLE_KEY"
          pnpm --filter @da/mobile exec expo prebuild --platform android --clean --no-install
          # The prebuild template's JVM settings (512m Metaspace) no longer fit the native module set;
          # the user-level gradle.properties overrides the project's. Only the emulator's ABI is built.
          mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
          {
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
            echo 'kotlin.daemon.jvmargs=-Xmx2g'
          } >>"${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
          (cd apps/mobile/android && ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=x86_64)
          echo "E2E_APK=$PWD/apps/mobile/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"

      # tr-TR is set by scripts/e2e/prepare-emulator.sh: the emulator's own -change-locale restarts the
      # framework right after boot, while the action's first `adb shell input keyevent 82` runs (run 60).
      - name: Emulator API 35 x86_64 google_apis (tr-TR) + Maestro over tag android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          avd-name: test
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -read-only -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect -timezone Europe/Istanbul
          script: bash scripts/e2e/run-maestro-android.sh

      - name: JUnit, screenshots and logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-e2e-android
          path: |
            build/maestro
            build/e2e/*.log
          retention-days: 14
