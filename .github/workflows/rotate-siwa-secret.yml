name: Rotate SIWA client secret

# Sign in with Apple web-flow client secret rotation (KPL-49, STORE_CHECKLIST, INTEGRATION_PLAN §6.2,
# docs/DEPLOYMENT.md). Apple accepts the ES256 client secret for at most six months; this job mints
# a new one (exp 180 days) from the SIWA key and stores it on the hosted Supabase Auth Apple provider
# through the Management API, plus the Edge secret APPLE_SIWA_WEB_SECRET_NOT_AFTER that System Health
# shows as an expiry card.
#
# Schedule: 1 January, 1 June and 1 November (gaps of 5, 5 and 2 months; each secret lives 180
# days). Scheduled runs apply; a manual run is a dry run unless `dry_run` is unticked. Both run in the
# protected `production` environment, whose required reviewers are the approval (a manual external
# step, like deploy-supabase.yml). A missing secret fails the run with the names it needs; nothing
# is skipped silently. The private key and the token are never printed.

on:
  schedule:
    - cron: '41 6 1 1,6,11 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Mint and verify the secret only (no change to the hosted project)
        type: boolean
        default: true

concurrency:
  group: rotate-siwa-secret
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rotate:
    name: siwa client secret (${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'dry run' || 'apply' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIWA_KEY_ID: ${{ secrets.APPLE_SIWA_KEY_ID }}
      APPLE_SIWA_PRIVATE_KEY: ${{ secrets.APPLE_SIWA_PRIVATE_KEY }}
      APPLE_SIWA_SERVICES_ID: ${{ secrets.APPLE_SIWA_SERVICES_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Mint and verify (dry run)
        if: env.DRY_RUN == 'true'
        run: node scripts/deploy/siwa-client-secret.ts --days 180 --github-output "$GITHUB_OUTPUT"

      - name: Mint, verify and update Supabase Auth
        if: env.DRY_RUN != 'true'
        id: apply
        run: node scripts/deploy/siwa-client-secret.ts --days 180 --apply --github-output "$GITHUB_OUTPUT"

      - name: Summary
        if: env.DRY_RUN != 'true'
        run: |
          {
            echo "### Sign in with Apple client secret rotated"
            echo "New expiry (APPLE_SIWA_WEB_SECRET_NOT_AFTER): ${{ steps.apply.outputs.not_after }}"
            echo "The next deploy-supabase run mints its own secret from the same key, so config push keeps a current value."
          } >> "$GITHUB_STEP_SUMMARY"
