appId: com.dijitalasistan.app.e2e
name: 'E2E-S-02 · Mail intelligence category routing'
tags: [screens, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: canon
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- openLink: 'dijitalasistan-e2e://mail'
- extendedWaitUntil: { visible: { id: 'mail.categories' }, timeout: 30000 }
- tapOn: '${output.t.mail.categories.has_deadline}'
- extendedWaitUntil: { visible: { id: 'mailCategory.screen' }, timeout: 30000 }
- back
- tapOn: '${output.t.mail.categories.low_priority}'
- extendedWaitUntil: { visible: { id: 'mailCategory.screen' }, timeout: 30000 }
- back
- tapOn: '${output.t.mail.categories.awaiting_my_reply}'
- extendedWaitUntil: { visible: { id: 'waiting.screen' }, timeout: 30000 }
