appId: com.dijitalasistan.app.e2e
name: 'E2E-S-03 · Every Email Detail action reaches a real target'
tags: [screens, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: canon
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- openLink: 'dijitalasistan-e2e://mail/${output.ids.messageAhmet}'
- extendedWaitUntil: { visible: { id: 'email.screen' }, timeout: 30000 }
- tapOn: { id: 'email.tile.reply' }
- extendedWaitUntil: { visible: { id: 'reply.screen' }, timeout: 30000 }
- back
- tapOn: { id: 'email.tile.task' }
- extendedWaitUntil: { visible: { id: 'sheet.approval' }, timeout: 30000 }
- back
- tapOn: { id: 'email.tile.calendar' }
- extendedWaitUntil: { visible: { id: 'sheet.approval' }, timeout: 30000 }
- back
- tapOn: { id: 'email.tile.remind' }
- extendedWaitUntil: { visible: { id: 'sheet.reminder' }, timeout: 30000 }
- back
- tapOn: { id: 'email.more' }
- extendedWaitUntil: { visible: { id: 'm2.menu' }, timeout: 30000 }
- back
- tapOn: { id: 'email.badge' }
- extendedWaitUntil: { visible: { id: 'sheet.why' }, timeout: 30000 }
