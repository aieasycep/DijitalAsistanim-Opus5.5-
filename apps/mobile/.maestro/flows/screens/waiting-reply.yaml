appId: com.dijitalasistan.app.e2e
name: 'E2E-S-04 · Waiting on you: buckets and actions'
tags: [screens, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: canon
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- openLink: 'dijitalasistan-e2e://waiting'
- extendedWaitUntil: { visible: { id: 'waiting.screen' }, timeout: 30000 }
- tapOn: '${output.t.waiting.actions.prepareReply}'
- extendedWaitUntil: { visible: { id: 'reply.screen' }, timeout: 30000 }
- back
- tapOn: '${output.t.waiting.actions.remind}'
- extendedWaitUntil: { visible: { id: 'sheet.reminder' }, timeout: 30000 }
