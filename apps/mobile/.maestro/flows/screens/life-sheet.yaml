appId: com.dijitalasistan.app.e2e
name: 'E2E-S-06 · Life sheet actions'
tags: [screens, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: canon
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- openLink: 'dijitalasistan-e2e://search'
- tapOn: { id: 'search.field' }
- inputText: 'fatura'
- tapOn: 1.842 TL
- extendedWaitUntil: { visible: { id: 'life.sheet' }, timeout: 30000 }
- assertVisible: { id: 'life.fields' }
- tapOn: '${output.t.life.actions.remind}'
- extendedWaitUntil: { visible: { id: 'sheet.reminder' }, timeout: 30000 }
