appId: com.dijitalasistan.app.e2e
name: 'E2E-S-13 · VIP from a suggestion and the person page'
tags: [screens, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: canon
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- openLink: 'dijitalasistan-e2e://settings'
- tapOn: { id: 'hub.row.vip' }
- extendedWaitUntil: { visible: { id: 'screen.vip' }, timeout: 30000 }
- tapOn: { id: 'vip.suggestion.yes' }
- tapOn: Mehmet Yılmaz
- extendedWaitUntil: { visible: { id: 'screen.person' }, timeout: 30000 }
- assertVisible: { id: 'person.composer' }
