appId: com.dijitalasistan.app.e2e
name: 'E2E-A · Onboarding → Today'
tags: [acceptance, android, ios, free]
env:
  USER_KEY: u_new
  SCENARIO: none
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- tapOn: { id: 'intro.start' }
- tapOn: { id: 'intro.skip' }
- tapOn: { id: 'auth.provider.email' }
- tapOn: { id: 'auth.email.field' }
- inputText: '${output.user.email}'
- tapOn: { id: 'auth.email.send' }
- runScript:
    file: ../../scripts/harness.js
    env: { ACTION: otp, EMAIL: '${output.user.email}' }
- tapOn: { id: 'auth.code.input' }
- inputText: '${output.otp.code}'
- tapOn: { id: 'auth.code.verify' }
- extendedWaitUntil: { visible: { id: 'onboarding.connectMail' }, timeout: 30000 }
- tapOn: { id: 'connectMail.row.google' }
- runFlow: ../../subflows/demo-consent.yaml
- tapOn: { id: 'connectMail.continue' }
- extendedWaitUntil: { visible: { id: 'onboarding.connectCalendar' }, timeout: 30000 }
- tapOn: { id: 'connectCalendar.row.google' }
- runFlow: ../../subflows/demo-consent.yaml
- tapOn: { id: 'connectCalendar.continue' }
- extendedWaitUntil: { visible: { id: 'onboarding.permissions' }, timeout: 30000 }
- tapOn: { id: 'permissions.continue' }
- extendedWaitUntil: { visible: { id: 'onboarding.personalization' }, timeout: 30000 }
- tapOn: { id: 'personalization.continue' }
- extendedWaitUntil: { visible: { id: 'onboarding.schedule' }, timeout: 30000 }
- tapOn: { id: 'schedule.continue' }
- extendedWaitUntil: { visible: { id: 'onboarding.vip' }, timeout: 30000 }
- tapOn: { id: 'vip.skip' }
- extendedWaitUntil: { visible: { id: 'onboarding.analysis' }, timeout: 30000 }
- extendedWaitUntil: { visible: { id: 'onboarding.ready' }, timeout: 60000 }
- tapOn: { id: 'ready.continue' }
- extendedWaitUntil: { visible: { id: 'onboarding.notifications' }, timeout: 30000 }
- tapOn: { id: 'notifications.later' }
- runFlow:
    when: { platform: Android }
    commands:
      - extendedWaitUntil: { visible: { id: 'onboarding.androidNi' }, timeout: 30000 }
      - tapOn: { id: 'androidNi.skip' }
- extendedWaitUntil: { visible: { id: 'tab.today' }, timeout: 60000 }
- assertVisible: { id: 'today.hero' }
