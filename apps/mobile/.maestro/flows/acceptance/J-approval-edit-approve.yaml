appId: com.dijitalasistan.app.e2e
name: 'E2E-J · Approval: edit → approve'
tags: [acceptance, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: approvals_mixed
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- openLink: 'dijitalasistan-e2e://approvals'
- extendedWaitUntil: { visible: { id: 'screen.approvals' }, timeout: 30000 }
- tapOn: { id: 'approvals.card.${output.ids.approvalCalendar}' }
- tapOn: { id: 'approvalSheet.edit' }
- extendedWaitUntil: { visible: { id: 'sheet.approvalEditor' }, timeout: 30000 }
- tapOn: { id: 'approvalEditor.when' }
- tapOn: { id: 'approvalEditor.save' }
- extendedWaitUntil: { visible: '${output.t.approvals.editor.saved}', timeout: 30000 }
- runFlow: ../../subflows/approve-sheet.yaml
- extendedWaitUntil: { visible: '${output.t.approvals.results.calendar_update}', timeout: 60000 }
- runScript:
    file: ../../scripts/harness.js
    env:
      {
        ACTION: state,
        USER_KEY: '${USER_KEY}',
        PROBE: 'approval:${output.ids.approvalCalendar}',
        FIELD: status,
        EXPECT: 'executed',
      }
