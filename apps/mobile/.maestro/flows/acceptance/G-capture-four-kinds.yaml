appId: com.dijitalasistan.app.e2e
name: 'E2E-G · Capture: photo, PDF, link and text'
tags: [acceptance, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: canon
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- addMedia:
    - ../../assets/fatura-ck-enerji.png
- openLink: 'dijitalasistan-e2e://capture'
- extendedWaitUntil: { visible: { id: 'screen.capture' }, timeout: 30000 }
- tapOn: { id: 'capture.library' }
- extendedWaitUntil: { visible: { id: 'sheet.photoSource' }, timeout: 30000 }
- tapOn: '${output.t.capture.sources.library}'
- tapOn: { id: 'capture.analyze' }
- extendedWaitUntil: { visible: { id: 'capture.results' }, timeout: 90000 }
- assertVisible: 1.842
- tapOn: { id: 'capture.send' }
- runFlow: ../../subflows/approve-sheet.yaml
- extendedWaitUntil: { visible: { id: 'capture.success' }, timeout: 60000 }
- openLink: 'dijitalasistan-e2e://capture'
- tapOn: { id: 'capture.url' }
- inputText: 'https://example.com/'
- hideKeyboard
- tapOn: { id: 'capture.analyze' }
- extendedWaitUntil: { visible: { id: 'capture.results' }, timeout: 90000 }
- tapOn: { id: 'capture.saveMemory' }
- openLink: 'dijitalasistan-e2e://capture'
- tapOn: { id: 'capture.text' }
- inputText: 'Perşembe 15:00 Ayşe ile kahve, öncesinde raporu bitir.'
- hideKeyboard
- tapOn: { id: 'capture.analyze' }
- extendedWaitUntil: { visible: { id: 'capture.results' }, timeout: 90000 }
- tapOn: { id: 'capture.send' }
- runFlow: ../../subflows/approve-sheet.yaml
- extendedWaitUntil: { visible: { id: 'capture.success' }, timeout: 60000 }
- runScript:
    file: ../../scripts/harness.js
    env: { ACTION: state, USER_KEY: '${USER_KEY}', PROBE: 'approvals_by_status' }
