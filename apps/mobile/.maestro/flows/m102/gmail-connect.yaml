appId: com.dijitalasistan.app.e2e
name: 'E2E-M-03 · Gmail connect (demo adapter)'
tags: [m102, android, ios, free]
env:
  USER_KEY: u_empty
  SCENARIO: none
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- extendedWaitUntil: { visible: '${output.t.states.empty.noAccount.title}', timeout: 60000 }
- tapOn: '${output.t.states.empty.noAccount.cta}'
- extendedWaitUntil: { visible: { id: 'screen.accounts' }, timeout: 30000 }
- tapOn: { id: 'accounts.add' }
- tapOn: { id: 'addAccount.gmail' }
- tapOn: { id: 'explainer' }
- runFlow: ../../subflows/demo-consent.yaml
- extendedWaitUntil: { visible: { id: 'screen.accounts' }, timeout: 30000 }
- tapOn: '${output.t.common.providers.gmail}'
- extendedWaitUntil: { visible: { id: 'screen.accountDetail' }, timeout: 30000 }
- assertVisible: { id: 'account.scopes' }
- runFlow: { file: ../../subflows/open-tab.yaml, env: { TAB: flow } }
- extendedWaitUntil: { visible: { id: 'flow.list' }, timeout: 90000 }
- openLink: 'dijitalasistan-e2e://settings/accounts'
- tapOn: { id: 'accounts.add' }
- tapOn: { id: 'addAccount.outlook' }
- assertVisible: { id: 'sheet.proGate' }
- back
- tapOn: '${output.t.common.providers.gmail}'
- tapOn: { id: 'account.disconnect' }
- tapOn: { id: 'disconnect.confirm' }
- extendedWaitUntil: { visible: { id: 'accounts.empty' }, timeout: 30000 }
- runScript:
    file: ../../scripts/harness.js
    env:
      {
        ACTION: state,
        USER_KEY: '${USER_KEY}',
        PROBE: 'connected_accounts',
        FIELD: count,
        EXPECT: '0',
      }
