appId: com.dijitalasistan.app.e2e
name: 'E2E-M-08 · Approval'
tags: [m102, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: approvals_mixed
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- extendedWaitUntil: { visible: { id: 'today.approvals' }, timeout: 60000 }
- tapOn: { id: 'today.approvals' }
- extendedWaitUntil: { visible: { id: 'screen.approvals' }, timeout: 30000 }
- tapOn: { id: 'approvals.card.${output.ids.approvalCalendar}' }
- runFlow: ../../subflows/approve-sheet.yaml
- extendedWaitUntil: { visible: '${output.t.approvals.results.calendar_create}', timeout: 60000 }
- tapOn: { id: 'approvals.historyLink' }
- extendedWaitUntil: { visible: { id: 'screen.approvals.history' }, timeout: 30000 }
- assertVisible: '${output.t.approvals.statuses.executed}'
- openLink: 'dijitalasistan-e2e://approvals/${output.ids.approvalReply}'
- extendedWaitUntil: { visible: { id: 'screen.approvalDetail' }, timeout: 30000 }
- runScript:
    file: ../../scripts/harness.js
    env: { ACTION: state, USER_KEY: '${USER_KEY}', PROBE: 'approvals_by_status' }
