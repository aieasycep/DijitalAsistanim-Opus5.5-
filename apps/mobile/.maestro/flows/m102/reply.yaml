appId: com.dijitalasistan.app.e2e
name: 'E2E-M-07 · Reply'
tags: [m102, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: canon
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- openLink: 'dijitalasistan-e2e://mail/${output.ids.messageAhmet}'
- extendedWaitUntil: { visible: { id: 'email.screen' }, timeout: 30000 }
- tapOn: { id: 'email.tile.reply' }
- extendedWaitUntil: { visible: { id: 'reply.editor' }, timeout: 60000 }
- assertVisible: '${output.t.reply.tones.short}'
- assertVisible: '${output.t.reply.tones.professional}'
- assertVisible: '${output.t.reply.tones.friendly}'
- assertVisible: '${output.t.reply.tones.detailed}'
- tapOn: '${output.t.reply.tones.short}'
- extendedWaitUntil: { visible: { id: 'reply.editor' }, timeout: 60000 }
- tapOn: { id: 'reply.editor' }
- inputText: ' Teşekkürler.'
- hideKeyboard
- tapOn: { id: 'reply.approve' }
- runFlow: ../../subflows/approve-sheet.yaml
- extendedWaitUntil: { visible: { id: 'reply.sent' }, timeout: 60000 }
- runScript:
    file: ../../scripts/harness.js
    env:
      {
        ACTION: state,
        USER_KEY: '${USER_KEY}',
        PROBE: 'emails_sent_via_approval',
        FIELD: count,
        EXPECT: '1',
      }
