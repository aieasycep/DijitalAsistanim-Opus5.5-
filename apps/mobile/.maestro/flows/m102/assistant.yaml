appId: com.dijitalasistan.app.e2e
name: 'E2E-M-13 · Assistant'
tags: [m102, android, ios, pro]
env:
  USER_KEY: u_pro
  SCENARIO: canon
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- runFlow: { file: ../../subflows/open-tab.yaml, env: { TAB: assistant } }
- extendedWaitUntil: { visible: { id: 'screen.assistant' }, timeout: 30000 }
- assertVisible: '${output.t.assistant.prompts.focus}'
- assertVisible: '${output.t.assistant.prompts.replies}'
- assertVisible: '${output.t.assistant.prompts.tomorrowBusy}'
- assertVisible: '${output.t.assistant.prompts.deadlinesThisWeek}'
- assertVisible: '${output.t.assistant.composer.hint}'
- tapOn: '${output.t.assistant.prompts.replies}'
- extendedWaitUntil: { visible: { id: 'screen.chat' }, timeout: 30000 }
- extendedWaitUntil: { visible: Ahmet Yılmaz, timeout: 60000 }
- tapOn: Ahmet Yılmaz
- extendedWaitUntil: { visible: { id: 'email.screen' }, timeout: 30000 }
- back
- tapOn: { id: 'chat.composer' }
- inputText: "Mars'taki en yüksek dağ hangisi?"
- hideKeyboard
- extendedWaitUntil: { visible: { id: 'chat.noAnswer.rephrase' }, timeout: 60000 }
