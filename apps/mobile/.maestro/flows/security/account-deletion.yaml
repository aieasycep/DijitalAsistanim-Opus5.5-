appId: com.dijitalasistan.app.e2e
name: 'TST-E2E-M-02 · Account deletion with re-auth'
tags: [security, android, ios, pro]
env:
  USER_KEY: u_delete
  SCENARIO: deletion
onFlowStart:
  - runScript:
      file: ../../scripts/harness.js
      env: { ACTION: seed, USER_KEY: '${USER_KEY}', SCENARIO: '${SCENARIO}' }
---
- launchApp: { clearState: true, permissions: { notifications: allow } }
- runFlow: ../../subflows/sign-in-otp.yaml
- openLink: 'dijitalasistan-e2e://settings/privacy/delete-account'
- extendedWaitUntil: { visible: { id: 'screen.privacy.deleteAccount' }, timeout: 30000 }
- tapOn: { id: 'deleteAccount.continue' }
- tapOn: { id: 'reauth.sendCode' }
- runScript:
    file: ../../scripts/harness.js
    env: { ACTION: otp, EMAIL: '${output.user.email}' }
- tapOn: { id: 'reauth.code' }
- inputText: '${output.otp.code}'
- tapOn: { id: 'reauth.verify' }
- tapOn: { id: 'deleteAccount.word' }
- inputText: 'SİL'
- tapOn: { id: 'deleteAccount.submit' }
- extendedWaitUntil: { visible: { id: 'deleteAccount.queued' }, timeout: 30000 }
- runScript:
    file: ../../scripts/harness.js
    env: { ACTION: drain }
- runScript:
    file: ../../scripts/harness.js
    env: { ACTION: state, USER_KEY: '${USER_KEY}', PROBE: 'deletion_request' }
